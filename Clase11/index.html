<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clase 11 - Mariano Nozzi - DAW 2025</title>
  <link rel="stylesheet" href="CSS/normalize.css" />
  <link rel="stylesheet" href="CSS/estilos.css" />
</head>
<body>
  <h1>Rick and Morty - Personajes</h1>

  <button id="btnTodos">Mostrar todos los personajes</button>

  <h2>Filtrar personajes</h2>
  <div id="filtros">
    <input type="text" id="name" placeholder="Nombre">
    <input type="text" id="status" placeholder="Estado (alive, dead, unknown)">
    <input type="text" id="species" placeholder="Especie">
    <input type="text" id="type" placeholder="Tipo">
    <input type="text" id="gender" placeholder="Género (female, male, genderless, unknown)">
    <button id="btnFiltrar">Buscar con filtros</button>
  </div>

  <div id="resultado"></div>

  <script src="JS/script.js"></script>
</body>
</html>
